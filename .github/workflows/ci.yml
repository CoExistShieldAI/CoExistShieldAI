name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Go Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend-cloudrun/go.mod

      - name: Run Go Unit Tests
        run: |
          cd backend-cloudrun
          go test -v -race ./...

      - name: Build Static Binary
        run: |
          cd backend-cloudrun
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o server ./cmd/server

  kmp-client-test:
    name: KMP Shared & Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM Unit Tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Build Webpack Bundle
        run: ./gradlew :shared:jsBrowserProductionWebpack --no-daemon

      - name: Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon
