name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Go Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend-cloudrun/go.mod

      - name: Run Go Unit Tests
        run: |
          cd backend-cloudrun
          go test -v -race ./...

      - name: Build Static Binaries
        run: |
          cd backend-cloudrun
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o server ./cmd/server
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o job ./cmd/job

  kmp-client-test:
    name: KMP Shared & Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM Unit Tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Build Web Production Distribution
        run: ./gradlew :shared:jsBrowserDistribution --no-daemon

      - name: Set up Node.js for Web E2E Tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright & Run Web E2E Tests
        run: |
          cd web-e2e
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm test

      - name: Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

  firestore-rules-test:
    name: Firestore Security Rules Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Test Dependencies & Run Rules Tests
        run: |
          cd firebase-tests
          npm ci || npm install
          npm test
