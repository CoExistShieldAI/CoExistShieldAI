name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Go Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend-cloudrun/go.mod

      - name: Run Go Unit Tests
        run: |
          cd backend-cloudrun
          go test -v -race ./...

      - name: Build Static Binaries
        run: |
          cd backend-cloudrun
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o server ./cmd/server
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o job ./cmd/job

  kmp-client-test:
    name: KMP Shared & Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM Unit Tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

  e2e-integration-test:
    name: Full E2E & Backend Live Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.test.yml config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend-cloudrun/go.mod

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Web Production Distribution
        run: ./gradlew :shared:jsBrowserDistribution --no-daemon

      - name: Set up Node.js for Web E2E
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright & Run E2E Integration Suite
        run: |
          cd web-e2e
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm test

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web-e2e/playwright-report/
          retention-days: 7

  firestore-rules-test:
    name: Firestore Security Rules Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Test Dependencies & Run Rules Tests
        run: |
          cd firebase-tests
          npm ci || npm install
          npm test

  web-admin-test:
    name: Web Admin Portal Build & Key Injection Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json

      - name: Install Dependencies and Build Web Admin
        env:
          GOOGLE_MAPS_API_KEY: "AIzaSyMockKeyForVerificationTest123"
        run: |
          cd web-admin
          npm ci
          npm run build

      - name: Verify Key Injection Script
        env:
          GOOGLE_MAPS_API_KEY: "AIzaSyMockKeyForVerificationTest123"
        run: |
          scripts/render_admin_config.sh
          grep -q "AIzaSyMockKeyForVerificationTest123" web-admin/dist/web-admin/browser/index.html
          ! grep -q "__GOOGLE_MAPS_API_KEY__" web-admin/dist/web-admin/browser/index.html
          echo "Verified key injection in web-admin distribution"

  ionic-app-test:
    name: Ionic App (Angular + Capacitor) Build & Key Injection Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ionic-app/package-lock.json

      - name: Install Dependencies and Build Ionic App
        env:
          GOOGLE_MAPS_API_KEY: "AIzaSyMockKeyForVerificationTest123"
        run: |
          cd ionic-app
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Verify Key Injection Script
        env:
          GOOGLE_MAPS_API_KEY: "AIzaSyMockKeyForVerificationTest123"
        run: |
          scripts/render_ionic_config.sh
          grep -q "AIzaSyMockKeyForVerificationTest123" ionic-app/dist/ionic-app/browser/index.html
          ! grep -q "__GOOGLE_MAPS_API_KEY__" ionic-app/dist/ionic-app/browser/index.html
          echo "Verified key injection in ionic-app distribution"


