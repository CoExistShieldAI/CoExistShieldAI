name: Deploy Backend to Google Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'backend-cloudrun/**'
      - '.github/workflows/deploy-cloudrun.yml'
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: 'Google Cloud Project ID'
        required: false
        default: 'coexistshield-ai'
      gcp_region:
        description: 'Cloud Run Region'
        required: false
        default: 'asia-southeast1'

jobs:
  deploy-cloud-run:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_CORALD || secrets.FIREBASE_SERVICE_ACCOUNT_COEXISTSHIELD_AI }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ github.event.inputs.gcp_project_id || secrets.GCP_PROJECT_ID || 'corald' }}
          REGION: ${{ github.event.inputs.gcp_region || 'asia-southeast1' }}
        run: |
          chmod +x ./scripts/deploy_cloudrun.sh
          ./scripts/deploy_cloudrun.sh "${PROJECT_ID}" "${REGION}"

